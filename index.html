<!doctype html>
<html lang="en">
  <head>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="jo yamazaki ホーム">
        <img src="./joyamazakilogo.svg" alt="jo yamazaki" />
      </a>

      <div class="header-actions">
        <nav class="desktop-nav" aria-label="Main navigation">
          <a href="./" aria-current="page">work</a>
          <a href="./about/">about</a>
          <a href="./contact/">contact</a>
          <a href="./portfolio/">portfolio</a>
        </nav>

        <nav class="language-switch" aria-label="Language">

        <button
          class="menu-button"
          type="button"
          aria-label="Open menu"
          data-label-open="Open menu"
          data-label-close="Close menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <span></span>
          <span></span>
        </button>

    </header>

    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">

        <a href="./contact/">contact</a>
        <a href="./portfolio/">portfolio</a>
      </nav>
    </div>

    <main id="top">
      <h1 class="visually-hidden">jo yamazaki — Works</h1>
      <section class="works" id="works" aria-label="Works">

          <h2 class="visually-hidden">Graduation project 01</h2>
          <img src="./works/graduation-01.webp" alt="Graduation project work 1" width="1600" height="2000" fetchpriority="high" decoding="async" />

        <article class="work-card">
          <h2 class="visually-hidden">Graduation project 02</h2>
          <img src="./works/graduation-02.webp" alt="Graduation project work 2" width="1600" height="2000" loading="lazy" decoding="async" />

        <article class="work-card">
          <h2 class="visually-hidden">Graduation project 03</h2>
          <img src="./works/graduation-03.webp" alt="Graduation project work 3" width="1600" height="2000" loading="lazy" decoding="async" />

        </article>
      </section>

    <footer class="site-footer">© 2027 jo yamazaki</footer>
