<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="jo yamazaki portfolio" />
    <meta name="theme-color" content="#E6E6E6" />
    <link rel="alternate" hreflang="en" href="https://joyamazaki.github.io/joyamazaki-portfolio/" />
    <link rel="alternate" hreflang="ja" href="https://joyamazaki.github.io/joyamazaki-portfolio/jp/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260913-11" />
    <title>jo yamazaki portfolio</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="jo yamazaki ホーム">
        <img src="./joyamazakilogo.svg" alt="jo yamazaki" />
      </a>

      <div class="header-actions">
        <nav class="desktop-nav" aria-label="Main navigation">
          <a href="./" aria-current="page">work</a>
          <a href="./about/">about</a>
          <a href="./contact/">contact</a>
        </nav>

        <nav class="language-switch" aria-label="Language">
          <a class="is-active" href="./" aria-label="English, current language">EN</a>
          <span aria-hidden="true">/</span>
          <a href="./jp/" lang="ja">JP</a>
        </nav>

        <button
          class="menu-button"
          type="button"
          aria-label="Open menu"
          data-label-open="Open menu"
          data-label-close="Close menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
      <nav aria-label="Mobile navigation">
        <a href="./" aria-current="page">work</a>
        <a href="./about/">about</a>
        <a href="./contact/">contact</a>
      </nav>
    </div>

    <main id="top">
      <h1 class="visually-hidden">jo yamazaki — Works</h1>
      <section class="works" id="works" aria-label="Works">
        <article class="work-card">
          <h2 class="visually-hidden">ARCHX</h2>
          <img src="./works/archx.svg" alt="ARCHX 作品画像プレースホルダー" width="1600" height="1040" />
        </article>
        <article class="work-card">
          <h2 class="visually-hidden">PERCENTZ</h2>
          <img src="./works/percentz.svg" alt="PERCENTZ 作品画像プレースホルダー" width="1600" height="1280" />
        </article>
        <article class="work-card">
          <h2 class="visually-hidden">HWK</h2>
          <img src="./works/hwk.svg" alt="HWK 作品画像プレースホルダー" width="1600" height="1000" />
        </article>
        <article class="work-card">
          <h2 class="visually-hidden">BELULU</h2>
          <img src="./works/belulu.svg" alt="BELULU 作品画像プレースホルダー" width="1600" height="1200" />
        </article>
        <article class="work-card">
          <h2 class="visually-hidden">REVWALKER</h2>
          <img src="./works/revwalker.svg" alt="REVWALKER 作品画像プレースホルダー" width="1600" height="900" />
        </article>
        <article class="work-card">
          <h2 class="visually-hidden">その他の作品</h2>
          <img src="./works/other.svg" alt="その他の作品画像プレースホルダー" width="1600" height="1120" />
        </article>
      </section>

    </main>

    <script src="./main.js?v=20260913-10"></script>
  </body>
</html>
