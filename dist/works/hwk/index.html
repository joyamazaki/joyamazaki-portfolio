          <img class="pdf-preview" src="./pages/02.webp" alt="HWK — page 2 of 7. 10年後の未来に起こりうる背景として、より移動が 積極的になり、複数の拠点で生活する人や、そもそ も固定の住宅を持たない人が増えると想定した。 多拠点生活者 （アドレスホッパー） が増えた未来 Background 睡眠の質が低下しやすい Issue 03 ｜ HWK いつでもどこでも、 同じ感覚で眠ることが できたなら? Concept アドレスホッパーについて調査をした。初めて寝る場所では睡眠の質が落ちる「第一夜 効果」というものがある。また、宿の選定など日々の決定事項が増えているため、「決断 疲れ」という状態に陥りやすい。心身共に疲れがとれにくいことが、課題となっている。 ・第一夜効果 ・決断疲れ" width="4096" height="2897" loading="lazy" decoding="async" />
        </section>
        <section class="pdf-page" id="page-3" data-page-number="3" style="aspect-ratio: 1190.550048828125 / 841.8900146484375" aria-label="HWK, page 3 of 7">
          <img class="pdf-preview" src="./pages/03.webp" alt="HWK — page 3 of 7. 多拠点生活者が睡眠に必要な要素を調査 Research 視覚 聴覚 嗅覚 味覚 触覚 感覚を揃えるには? 揃えやすい 揃えにくい 感覚を五感に分解して思考した。アイマスクや耳栓を利用すれば、無音、無臭、無味、 暗闇、はすぐに実現できるので、触覚に課題があると考えた。感覚遮断装置（アイ ソレーションタンク）も検討したが、幻覚をもたらすため睡眠には向いておらず、 睡眠には適度な感覚が必要だとわかったため、寝る場所の硬さ、高さなどを同一 にすることが最適だという結論になった。 丸1日行動して実際に宿泊。カプセルホテルは 圧迫感があり、マットも固く、快適に眠れたと は言えない感覚を得た。第一夜効果を実感。 Concideration いつも使っている抱き枕・ぬいぐるみ、 タオルがあることでよく眠れると回答 57％ 眠れない原因 光、音、不安な考え事 月に1回以上自宅以外で寝ると回答 50％ 回答者 54名 年齢 18歳～24歳程度 大学構内に設置 ナインアワーズ 赤坂 / ドシー恵比寿 03 ｜ HWK アンケートを実施 カプセルホテルに実際に宿泊" width="4096" height="2897" loading="lazy" decoding="async" />
        </section>

          <img class="pdf-preview" src="./pages/05.webp" alt="HWK — page 5 of 7. 傾きを検知し、 クッションを自動調整 Styling 民家の畳、友人宅のソファ、カプセルホテルのベッドなど、様々な環境で眠 ることを想定。地面でも眠れることを目標として、傾きに応じて体を並行に 保つようにクッションが空いている部分をレベリングする。 圧縮して コンパクトに持ち運び アドレスホッパーがリュックに入れて持ち運ぶことができる ように、空気を圧縮してコンパクトにできる構造を考えた。 仰向け うつ伏せ 横向き 03 ｜ HWK" width="4096" height="2897" loading="lazy" decoding="async" />
